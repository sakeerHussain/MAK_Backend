spring.application.name=vehicle-rental
server.address=${SERVER_ADDRESS:127.0.0.1}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/car_rental}
spring.datasource.username=${DB_USER:car_rental}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB
app.upload-dir=${UPLOAD_DIR:uploads}

# SMTP credentials stay in environment variables. Enable only after configuring a provider.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Set a random 24+ character code only for the first administrator signup.
app.auth.bootstrap-code=${AUTH_BOOTSTRAP_CODE:}
app.auth.frontend-url=${FRONTEND_URL:http://localhost:5173}
server.servlet.session.cookie.name=RENTAL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Persistent booking alerts and SSE delivery.
app.notifications.scan-ms=${NOTIFICATION_SCAN_MS:30000}
app.notifications.dispatch-ms=${NOTIFICATION_DISPATCH_MS:2000}
app.notifications.pickup-minutes=${NOTIFICATION_PICKUP_MINUTES:60}
app.notifications.confirmation-minutes=${NOTIFICATION_CONFIRMATION_MINUTES:120}
app.notifications.escalation-minutes=${NOTIFICATION_ESCALATION_MINUTES:15}
app.notifications.email-escalation=${NOTIFICATION_EMAIL_ESCALATION:false}
spring.task.scheduling.pool.size=4
